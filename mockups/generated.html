<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dff8ff" />
  <meta name="description" content="Wordless FORM/0 Aero Wire interface concepts." />
  <title>FORM/0 — Wordless Aero Wire concepts</title>
  <link rel="stylesheet" href="./mockup.css" />
</head>
<body class="generated-page aero-gallery wordless-gallery">
  <div class="app-shell">
    <aside class="app-rail" aria-label="Concept navigation">
      <a class="logo icon-only" href="#primary" data-icon="orbit" aria-label="Primary view"></a>
      <nav class="rail-nav">
        <a class="rail-link icon-only" href="#primary" data-icon="world" aria-label="Primary view"></a>
        <a class="rail-link icon-only" href="#viewer" data-icon="cube" aria-label="Viewer"></a>
        <a class="rail-link icon-only" href="#thread" data-icon="thread" aria-label="Branch map"></a>
        <a class="rail-link icon-only" href="#studio" data-icon="shapes" aria-label="Studio"></a>
        <a class="rail-link icon-only" href="#mobile" data-icon="phone" aria-label="Mobile views"></a>
      </nav>
      <div class="rail-foot"><span class="signal" title="Complete"></span><span class="player-mark icon-only" data-icon="spark"></span></div>
    </aside>

    <main class="concept-page" id="primary">
      <header class="concept-head wordless-head">
        <span class="wordless-mark icon-only" data-icon="orbit" aria-hidden="true"></span>
        <span class="topbar-spacer"></span>
        <a class="icon-button icon-only" href="./generated/round-04/style-reference-aero.jpg" target="_blank" rel="noopener" data-icon="sliders" aria-label="Style reference"></a>
        <span class="signal" aria-hidden="true"></span>
      </header>

      <section class="concept-grid wordless-latest" aria-label="Primary concept">
        <article class="concept-card concept-wide">
          <a href="./generated/round-06/primary-desktop.jpg" target="_blank" rel="noopener">
            <img src="./generated/round-06/primary-desktop.jpg" alt="Wordless frameless primary view on a single vertical thread" />
          </a>
          <footer class="icon-footer"><span class="icon-only" data-icon="world" aria-hidden="true"></span><span class="icon-only" data-icon="desktop" aria-hidden="true"></span><a class="icon-only" href="./generated/round-06/primary-desktop.jpg" target="_blank" rel="noopener" data-icon="expand" aria-label="Open primary concept"></a></footer>
        </article>
      </section>

      <div class="wordless-divider" id="viewer"><span class="icon-only" data-icon="cube" aria-hidden="true"></span><i></i></div>
      <section class="concept-grid" aria-label="Wordless desktop viewer">
        <article class="concept-card concept-wide">
          <a href="./generated/round-06/viewer-desktop.jpg" target="_blank" rel="noopener"><img src="./generated/round-06/viewer-desktop.jpg" alt="Wordless frameless desktop model viewer" /></a>
          <footer class="icon-footer"><span class="icon-only" data-icon="cube" aria-hidden="true"></span><span class="icon-only" data-icon="desktop" aria-hidden="true"></span><a class="icon-only" href="./generated/round-06/viewer-desktop.jpg" target="_blank" rel="noopener" data-icon="expand" aria-label="Open viewer concept"></a></footer>
        </article>
      </section>

      <div class="wordless-divider" id="thread"><span class="icon-only" data-icon="thread" aria-hidden="true"></span><i></i></div>
      <section class="concept-grid" aria-label="Wordless desktop branch map">
        <article class="concept-card concept-wide">
          <a href="./generated/round-06/thread-desktop.jpg" target="_blank" rel="noopener"><img src="./generated/round-06/thread-desktop.jpg" alt="Wordless desktop branch map with frameless 3D models" /></a>
          <footer class="icon-footer"><span class="icon-only" data-icon="thread" aria-hidden="true"></span><span class="icon-only" data-icon="desktop" aria-hidden="true"></span><a class="icon-only" href="./generated/round-06/thread-desktop.jpg" target="_blank" rel="noopener" data-icon="expand" aria-label="Open branch-map concept"></a></footer>
        </article>
      </section>

      <div class="wordless-divider" id="studio"><span class="icon-only" data-icon="shapes" aria-hidden="true"></span><i></i></div>
      <section class="concept-grid" aria-label="Wordless desktop studio">
        <article class="concept-card concept-wide">
          <a href="./generated/round-06/studio-desktop-final.jpg" target="_blank" rel="noopener"><img src="./generated/round-06/studio-desktop-final.jpg" alt="Wordless desktop creation studio" /></a>
          <footer class="icon-footer"><span class="icon-only" data-icon="shapes" aria-hidden="true"></span><span class="icon-only" data-icon="desktop" aria-hidden="true"></span><a class="icon-only" href="./generated/round-06/studio-desktop-final.jpg" target="_blank" rel="noopener" data-icon="expand" aria-label="Open studio concept"></a></footer>
        </article>
      </section>

      <div class="wordless-divider" id="mobile"><span class="icon-only" data-icon="phone" aria-hidden="true"></span><i></i></div>
      <section class="mobile-concept-grid" aria-label="Wordless portrait mobile concepts">
        <article class="concept-card mobile-concept-card">
          <a href="./generated/round-06/primary-mobile.jpg" target="_blank" rel="noopener"><img src="./generated/round-06/primary-mobile.jpg" alt="Wordless portrait primary view" /></a>
          <footer class="icon-footer"><span class="icon-only" data-icon="world" aria-hidden="true"></span><a class="icon-only" href="./generated/round-06/primary-mobile.jpg" target="_blank" rel="noopener" data-icon="expand" aria-label="Open mobile primary concept"></a></footer>
        </article>
        <article class="concept-card mobile-concept-card">
          <a href="./generated/round-06/viewer-mobile.jpg" target="_blank" rel="noopener"><img src="./generated/round-06/viewer-mobile.jpg" alt="Wordless portrait viewer" /></a>
          <footer class="icon-footer"><span class="icon-only" data-icon="cube" aria-hidden="true"></span><a class="icon-only" href="./generated/round-06/viewer-mobile.jpg" target="_blank" rel="noopener" data-icon="expand" aria-label="Open mobile viewer concept"></a></footer>
        </article>
        <article class="concept-card mobile-concept-card">
          <a href="./generated/round-06/thread-mobile.jpg" target="_blank" rel="noopener"><img src="./generated/round-06/thread-mobile.jpg" alt="Wordless portrait branch map" /></a>
          <footer class="icon-footer"><span class="icon-only" data-icon="thread" aria-hidden="true"></span><a class="icon-only" href="./generated/round-06/thread-mobile.jpg" target="_blank" rel="noopener" data-icon="expand" aria-label="Open mobile branch-map concept"></a></footer>
        </article>
        <article class="concept-card mobile-concept-card">
          <a href="./generated/round-06/studio-mobile-final.jpg" target="_blank" rel="noopener"><img src="./generated/round-06/studio-mobile-final.jpg" alt="Wordless portrait creation studio" /></a>
          <footer class="icon-footer"><span class="icon-only" data-icon="shapes" aria-hidden="true"></span><a class="icon-only" href="./generated/round-06/studio-mobile-final.jpg" target="_blank" rel="noopener" data-icon="expand" aria-label="Open mobile studio concept"></a></footer>
        </article>
      </section>

      <footer class="concept-end wordless-end"><span class="orbit-mark" aria-hidden="true"></span></footer>
    </main>
  </div>
  <script type="module" src="./mockup.js"></script>
</body>
</html>
