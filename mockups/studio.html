<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#23231f" />
  <meta name="description" content="FORM/0 creation studio interface mockup." />
  <title>FORM/0 — Studio UI mockup</title>
  <link rel="stylesheet" href="./mockup.css" />
</head>
<body class="studio-page">
  <div class="app-shell studio-shell">
    <aside class="app-rail" aria-label="Primary navigation">
      <a class="logo" href="./index.html" aria-label="FORM/0 home">F<i>/</i>0</a>
      <nav class="rail-nav">
        <a class="rail-link icon-only" href="./index.html" data-icon="world" aria-label="world"></a>
        <a class="rail-link icon-only" href="./thread.html" data-icon="thread" aria-label="threads"></a>
        <a class="rail-link create active icon-only" href="./studio.html" data-icon="plus" aria-label="create" aria-current="page"></a>
        <a class="rail-link icon-only" href="./viewer.html" data-icon="cube" aria-label="viewer"></a>
        <button class="rail-link icon-only" type="button" data-icon="sliders" aria-label="settings"></button>
      </nav>
      <div class="rail-foot"><span class="signal" title="relays connected"></span><span class="player-mark">0x</span></div>
    </aside>

    <main class="studio-main">
      <aside class="tool-shelf" aria-label="Creation tools">
        <button class="tool-button active icon-only" type="button" data-icon="cube" data-studio-tool aria-label="object"></button>
        <button class="tool-button icon-only" type="button" data-icon="type" data-studio-tool aria-label="type"></button>
        <button class="tool-button icon-only" type="button" data-icon="brush" data-studio-tool aria-label="paint"></button>
        <button class="tool-button icon-only" type="button" data-icon="shapes" data-studio-tool aria-label="forms"></button>
        <span class="tool-rule"></span>
        <button class="tool-button icon-only" type="button" data-icon="light" data-studio-tool aria-label="light"></button>
        <div class="tool-spacer"></div>
        <button class="tool-button icon-only" type="button" data-icon="upload" aria-label="import GLB"></button>
      </aside>

      <section class="editor-stage" aria-label="3D creation stage">
        <header class="editor-topbar">
          <a class="icon-button icon-only" href="./index.html" data-icon="close" aria-label="Close studio"></a>
          <button class="icon-button icon-only" type="button" data-icon="undo" aria-label="Undo"></button>
          <button class="icon-button icon-only" type="button" data-icon="redo" aria-label="Redo"></button>
          <div class="file-crumb"><strong>STACK/BLUE</strong><span class="micro-label"><span data-tool-label>object</span> / selected</span></div>
          <div class="topbar-spacer"></div>
          <div class="saved-state micro-label"><i></i><span>local</span></div>
        </header>

        <div class="stage-canvas">
          <div class="stage-object-wrap" data-stage-object>
            <img src="./assets/blue-stack.jpg" alt="Blue modular creation selected on the stage" />
            <div class="selection-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="stage-hint micro-label"><kbd>drag</kbd><span>orbit</span><kbd>⇧</kbd><span>pan</span></div>
          <div class="axis-widget" aria-hidden="true"><i></i></div>
        </div>

        <footer class="editor-timeline">
          <button class="timeline-play icon-only" type="button" data-icon="play" aria-label="Preview motion"></button>
          <div class="timeline-track" aria-hidden="true"><span class="timeline-progress"></span></div>
          <span class="timeline-time micro-label">00:06 / 00:18</span>
        </footer>
      </section>

      <aside class="inspector" aria-label="Object inspector">
        <header class="inspector-head">
          <strong>STACK/BLUE</strong>
          <button class="icon-button icon-only" type="button" data-icon="more" aria-label="Object options"></button>
        </header>
        <nav class="inspector-tabs" aria-label="Inspector sections">
          <button class="inspector-tab active" type="button" data-inspector-tab="form">form</button>
          <button class="inspector-tab" type="button" data-inspector-tab="surface">surface</button>
          <button class="inspector-tab" type="button" data-inspector-tab="camera">camera</button>
        </nav>

        <div class="inspector-content">
          <div data-inspector-panel="form">
            <section class="inspector-section">
              <div class="section-title"><strong>TRANSFORM</strong><span class="micro-label">local</span></div>
              <div class="control-row">
                <div class="control-meta micro-label"><label for="rotate">rotation</label><output for="rotate">0°</output></div>
                <input id="rotate" type="range" min="-18" max="18" step="1" value="0" data-object-control="rotate" data-suffix="°" />
              </div>
              <div class="control-row">
                <div class="control-meta micro-label"><label for="scale">scale</label><output for="scale">1</output></div>
                <input id="scale" type="range" min="0.8" max="1.18" step="0.01" value="1" data-object-control="scale" />
              </div>
              <div class="position-grid">
                <label class="position-field micro-label">X<input type="number" value="0.00" step="0.1" /></label>
                <label class="position-field micro-label">Y<input type="number" value="0.12" step="0.1" /></label>
                <label class="position-field micro-label">Z<input type="number" value="0.00" step="0.1" /></label>
              </div>
            </section>
            <section class="inspector-section">
              <div class="section-title"><strong>LIGHT</strong><span class="micro-label">01</span></div>
              <div class="control-row">
                <div class="control-meta micro-label"><label for="light">intensity</label><output for="light">1</output></div>
                <input id="light" type="range" min="0.7" max="1.3" step="0.01" value="1" data-object-control="light" />
              </div>
            </section>
            <section class="inspector-section">
              <div class="section-title"><strong>SURFACE</strong><span class="micro-label">matte</span></div>
              <div class="material-swatches" aria-label="Quick material colors">
                <button class="swatch active" style="--swatch:#233ed1" type="button" aria-label="Cobalt"></button>
                <button class="swatch" style="--swatch:#ef5a3c" type="button" aria-label="Coral"></button>
                <button class="swatch" style="--swatch:#c9f04b" type="button" aria-label="Acid green"></button>
                <button class="swatch" style="--swatch:#191917" type="button" aria-label="Ink"></button>
                <button class="swatch" style="--swatch:#efeadf" type="button" aria-label="Paper"></button>
              </div>
            </section>
          </div>

          <div data-inspector-panel="surface" hidden>
            <section class="inspector-section">
              <div class="section-title"><strong>MATERIAL</strong><span class="micro-label">PBR</span></div>
              <div class="control-row"><div class="control-meta micro-label"><label>roughness</label><output>0.62</output></div><input type="range" min="0" max="1" step=".01" value=".62" /></div>
              <div class="control-row"><div class="control-meta micro-label"><label>metallic</label><output>0.08</output></div><input type="range" min="0" max="1" step=".01" value=".08" /></div>
            </section>
            <section class="inspector-section"><div class="section-title"><strong>COLOR</strong><span class="micro-label">#233ed1</span></div><div class="material-swatches"><button class="swatch active" style="--swatch:#233ed1" type="button"></button><button class="swatch" style="--swatch:#5069ff" type="button"></button><button class="swatch" style="--swatch:#101b78" type="button"></button></div></section>
          </div>

          <div data-inspector-panel="camera" hidden>
            <section class="inspector-section">
              <div class="section-title"><strong>MAIN CAMERA</strong><span class="micro-label">perspective</span></div>
              <div class="control-row"><div class="control-meta micro-label"><label>field of view</label><output>46°</output></div><input type="range" min="20" max="90" value="46" /></div>
              <div class="control-row"><div class="control-meta micro-label"><label>distance</label><output>4.2</output></div><input type="range" min="1" max="8" step=".1" value="4.2" /></div>
            </section>
            <section class="inspector-section"><div class="section-title"><strong>AUTHORED VIEWS</strong><span class="micro-label">03</span></div><button class="action-row" type="button" style="color:var(--ink);border-color:var(--line)"><span>add camera</span><em>+</em></button></section>
          </div>
        </div>

        <div class="publish-bar">
          <button class="publish-button" type="button" data-icon="publish" data-publish><span>release</span></button>
        </div>
      </aside>
    </main>
  </div>
  <script type="module" src="./mockup.js"></script>
</body>
</html>
